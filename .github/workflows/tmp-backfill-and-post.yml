# TEMPORARY. Two one-off jobs for the retroactive v1.7.2 release:
#   1. attach the assets release.yml would have attached
#   2. post the changelog to the addons forum thread
# Deleted once done.
name: tmp backfill and post

on:
  push:
    branches: [standardise-release-tooling]

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLUGIN_FILE: anchored_stretch.js
      PLUGIN_NAME: Anchored Stretch
      PLUGIN_ICON_URL: https://raw.githubusercontent.com/Embody-Games/EGT-AnchorStretch/main/anchored_stretch_icon.png
      PLUGIN_COLOR: 5865F2
      DISCORD_THREAD_ID: '1545490313370542090'
    steps:
      # Full history so the v1.7.2 tag is available to read from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The asset should be the code v1.7.2 actually was, not this branch's copy
      # with the PLUGIN_VERSION const added. changelog.json only exists here.
      - name: Attach the assets to v1.7.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          git show v1.7.2:anchored_stretch.js > dist/anchored_stretch.js
          cp changelog.json dist/changelog.json
          wc -c dist/*
          gh release upload v1.7.2 dist/anchored_stretch.js dist/changelog.json --clobber

      - name: Post 1.7.2 to the forum thread
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/discord_notify.mjs 1.7.2
